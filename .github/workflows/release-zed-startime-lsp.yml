name: Release Zed StarTime LSP

on:
 push:
  branches:
   - main
  paths:
   - packages/zed-startime-lsp/**
 workflow_dispatch:

permissions:
 contents: write
 id-token: write

concurrency:
 group: release-zed-startime-lsp
 cancel-in-progress: false

jobs:
 publish:
  if: >-
   github.event_name == 'workflow_dispatch' ||
   !contains(github.event.head_commit.message, '[skip zed-startime-lsp release]')
  runs-on: ubuntu-latest

  steps:
   - name: Check out repository
     uses: actions/checkout@v4
     with:
      fetch-depth: 0
      ref: ${{ github.ref }}

   - name: Set up Bun
     uses: oven-sh/setup-bun@v2
     with:
      bun-version: 1.3.14

   - name: Set up Node.js
     uses: actions/setup-node@v4
     with:
      node-version: 22.14.0
      registry-url: https://registry.npmjs.org

   - name: Install dependencies
     run: bun install --frozen-lockfile

   - name: Bump patch version
     working-directory: packages/zed-startime-lsp
     run: npm version patch --no-git-tag-version --ignore-scripts --workspaces=false

   - name: Update Bun lockfile
     run: bun install --lockfile-only

   - name: Build package
     run: bun run --cwd packages/zed-startime-lsp build

   - name: Publish package
     working-directory: packages/zed-startime-lsp
     run: npm publish --access public

   - name: Commit version bump
     run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add packages/zed-startime-lsp/package.json bun.lock
      git diff --cached --quiet || git commit -m "chore: Release Zed StarTime LSP [skip zed-startime-lsp release]"
      git push origin HEAD:${{ github.ref_name }}
