services:
 postgres:
  image: postgres:17-alpine
  container_name: startime-postgres
  restart: no
  environment:
   POSTGRES_DB: startime
   POSTGRES_USER: startime
   POSTGRES_PASSWORD: startime
  ports:
   - "6543:5432"
  volumes:
   - postgres_data:/var/lib/postgresql/data
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U startime -d startime"]
   interval: 5s
   timeout: 5s
   retries: 10

 redis:
  image: redis:7-alpine
  container_name: startime-redis
  restart: no
  ports:
   - "6379:6379"
  volumes:
   - redis_data:/data
  command: redis-server --appendonly yes
  healthcheck:
   test: ["CMD", "redis-cli", "ping"]
   interval: 5s
   timeout: 5s
   retries: 10

volumes:
 postgres_data:
 redis_data:
